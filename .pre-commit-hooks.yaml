- id: commit-message
  name: commit message format
  description: "Enforces '<type>(<area>): <summary>' and adds 'Refs #N' from the branch name."
  entry: wo-commit-message
  language: python
  stages: [commit-msg]
  always_run: true
  pass_filenames: true

- id: branch-name
  name: branch name and protected-branch push check
  description: "Enforces '<type>/<issue#>-<slug>' and blocks direct pushes to main and production."
  entry: wo-branch-name
  language: python
  stages: [pre-push]
  always_run: true
  pass_filenames: false

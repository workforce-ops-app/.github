# Reusable: posts the CI report from a finished `ci` run as a single PR comment
# that is edited on every new run. Called from a workflow_run workflow so it has
# write access even for PRs whose CI ran with a read-only token.
name: ci-comment (reusable)

on:
  workflow_call:
    inputs:
      shared-ref:
        type: string
        default: main

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: post report
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ci-report
          path: ci-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: hashFiles('ci-report/report.md') != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.shared-ref }}
          path: .shared
          persist-credentials: false
      - if: hashFiles('ci-report/report.md') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - if: hashFiles('ci-report/report.md') != ''
        name: Post or update the report comment
        run: python .shared/scripts/ci_comment.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-ops-hooks"
version = "0.1.0"
description = "Shared git hooks and workflow rules for the Workforce Operations Application repositories"
requires-python = ">=3.11"

[project.scripts]
wo-commit-message = "workforce_ops_hooks.cli:commit_message"
wo-branch-name = "workforce_ops_hooks.cli:branch_name"

[tool.setuptools.packages.find]
where = ["hooks"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # subprocess calls to git/gh with fixed arguments

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# Weekly dependency update PRs. Minor/patch updates are grouped per ecosystem;
# major updates arrive one per PR. See the dependencies guide and decision 0011.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

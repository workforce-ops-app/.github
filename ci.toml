# Operations run by CI and locally with:  python ../.github/scripts/ci_runner.py
# An operation whose `requires` paths are missing is skipped and the report says why,
# so checks switch on automatically as the project grows. Order here = report order.
# A failing operation can be bypassed with the label bypass:<name>, except
# pr-policy and secret-scan. See the contributor docs before using a bypass.

[[setup]]
run = "python -m pip install -r requirements-dev.txt"
requires = ["requirements-dev.txt"]
local = false

[[operation]]
name = "secret-scan"
run = 'docker run --rm -v "{repo}:/repo" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=*" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner'
requires = [".git"]
pass_summary = "no secrets found"

[[operation]]
name = "format-check"
run = "ruff format --check ."
requires = ["requirements-dev.txt"]

[[operation]]
name = "lint"
run = "ruff check ."
requires = ["requirements-dev.txt"]

[[operation]]
name = "unit-test"
run = "python -m unittest discover -s tests -t . -q"
requires = ["tests"]
